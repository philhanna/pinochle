<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinochle</title>
<link rel="stylesheet" href="/assets/table.css">
</head>
<body class="table-page">
<div id="stage">
  <div id="felt">
    <div class="seat top" id="seat-top"></div>
    <div class="seat left" id="seat-left"></div>
    <div class="seat right" id="seat-right"></div>
    <!-- The deck strewn over the middle of the felt for the dealer to be
         drawn from; empty and hidden the rest of the game. -->
    <div id="spread" hidden></div>
    <div id="centre"></div>
  </div>

  <aside id="scoreboard"></aside>
  <div id="deal-flight" hidden></div>
  <!-- Each team's won tricks, face down, with the card points taken so far. -->
  <div id="taken-theirs" class="taken" hidden></div>
  <div id="taken-ours" class="taken" hidden></div>
  <div id="contract-indicator" hidden></div>
  <div id="trump-indicator" hidden></div>
  <!-- The latest table notification stays prominent at the top, with the
       Continue control beside it whenever play is being held (UI-19a). -->
  <div id="notice" hidden></div>
  <!-- A transient complaint about one action, and a standing statement
       about whether this table is still connected to the game. -->
  <div id="toast" hidden></div>
  <div id="connection" hidden></div>

  <!-- Stacked rather than each positioned on its own, so a tall panel pushes
       the rest up instead of landing on top of it. -->
  <div id="bottom-bar">
    <div class="seat bottom" id="seat-bottom"></div>
    <div id="status"></div>
    <div id="panel" hidden></div>
    <div id="hand"></div>
  </div>
</div>
<script type="module" src="/static/main.js"></script>
</body>
</html>
