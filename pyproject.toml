[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pinochle"
version = "0.2.0"
description = "Web-based four-player Pinochle game"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Phil Hanna" }]
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pinochle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
